name: PR Policy

# Canonical PR Policy workflow, synced to every managed repo by pinginc/repos.
# https://www.notion.so/laurel-ai/38980a6931918189906fdd33bcb187c3

on:
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  labeler:
    name: labeler
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pinginc/actions/.github/actions/labeler@main

  add-author:
    name: add-author
    if: github.event.pull_request.assignee == null
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      # Matching an agent PR's requester reads org members, which GITHUB_TOKEN cannot.
      - id: token
        if: github.event.pull_request.user.type == 'Bot'
        uses: pinginc/actions/.github/actions/pingci-token@main
        with:
          app-client-id: ${{ secrets.PINGCI_APP_CLIENT_ID }}
          app-private-key: ${{ secrets.PINGCI_APP_PRIVATE_KEY }}
          fallback-token: ${{ secrets.PINGCI_TOKEN }}
          permission-members: read
          permission-pull-requests: write
      - uses: pinginc/actions/.github/actions/assign-author@main
        with:
          github-token: ${{ steps.token.outputs.token || github.token }}

  pr-lint:
    name: pr-lint
    needs: labeler
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pinginc/actions/.github/actions/pr-lint@main
        with:
          strict: "true"

  review-picker:
    name: review-picker
    needs: labeler
    # ready_for_review is in the triggers, so a draft gets its reviewer when it leaves draft.
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # skip repos with no generated CODEOWNERS (no owning team to pick from)
      - name: Detect CODEOWNERS
        id: co
        shell: bash
        run: |
          if [ -f .github/CODEOWNERS ]; then
            echo "present=true" >>"$GITHUB_OUTPUT"
          else
            echo "present=false" >>"$GITHUB_OUTPUT"
          fi
      # Load counts open review requests across every repo, so the token reaches all of them.
      - id: token
        if: steps.co.outputs.present == 'true'
        uses: pinginc/actions/.github/actions/pingci-token@main
        with:
          app-client-id: ${{ secrets.PINGCI_APP_CLIENT_ID }}
          app-private-key: ${{ secrets.PINGCI_APP_PRIVATE_KEY }}
          fallback-token: ${{ secrets.PINGCI_TOKEN }}
          repositories: "*"
          permission-members: read
          permission-pull-requests: write
      - if: steps.co.outputs.present == 'true'
        uses: pinginc/actions/.github/actions/review-picker@main
        with:
          # App token needed to read org team membership (GITHUB_TOKEN cannot)
          github-token: ${{ steps.token.outputs.token }}
