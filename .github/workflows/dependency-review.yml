name: Dependency Review

on:
  pull_request:
  workflow_dispatch:

jobs:
  generate:
    runs-on: ${{ vars.PINGINC_RUNNER || 'namespace-profile-ubuntu-24-amd64-1c-2g' }}
    permissions:
      actions: read
      contents: read
      pull-requests: write
    steps:
      - uses: pinginc/actions/.github/actions/dependency-review@main
